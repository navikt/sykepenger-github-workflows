name: Bygg og test modul

on:
  workflow_call:
    inputs:
      modul:
        description: 'Modulen som skal bygges og testes'
        required: true
        type: string

jobs:
  bygg-og-test:
    name: Bygg og test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: gradlew clean :${{ inputs.modul }}:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODUL: ${{ inputs.modul }}
        run: ./gradlew clean ":$MODUL:build" --build-cache
