name: Deploy v2

on:
  workflow_call:
    inputs:
      manifest:
        description: 'Manifestet som skal deployes.'
        required: true
        type: string
      environment:
        description: 'Nais-miljøet det skal deployes til.'
        required: true
        type: string
      image:
        description: 'Image som settes som spec.image. Utelates for ressurser uten image, eller for å beholde imaget som kjører nå.'
        required: false
        default: ''
        type: string
      extra_manifests:
        description: 'Kommaseparert liste med ekstra manifester som skal deployes, for eksempel db-policyer.'
        required: false
        default: ''
        type: string

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # for nais-innlogging
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Sett opp Nais CLI
      uses: nais/setup@fb8692f65df9c904e2cdac5d395630ac876abdcf # v1.0.3
      with:
        team: tbd
        environment: ${{ inputs.environment }}

    - name: nais apply
      env:
        MANIFEST: ${{ inputs.manifest }}
        ENVIRONMENT: ${{ inputs.environment }}
        IMAGE: ${{ inputs.image }}
        EXTRA_MANIFESTS: ${{ inputs.extra_manifests }}
      run: |
        set -euo pipefail

        while IFS= read -r manifest; do
          [ -n "$manifest" ] || continue
          nais apply "$manifest" --environment "$ENVIRONMENT" --wait
        done < <(tr ',' '\n' <<< "$EXTRA_MANIFESTS" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

        if [ -n "$IMAGE" ]; then
          nais apply "$MANIFEST" --environment "$ENVIRONMENT" --set "spec.image=$IMAGE" --wait
        else
          nais apply "$MANIFEST" --environment "$ENVIRONMENT" --wait
        fi
